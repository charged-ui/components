<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dialog fixture</title>
    <style>
      /* The fixture loads no theme, so set a contrast-safe surface for axe. */
      body {
        background: #fff;
        color: #171717;
        padding: 2rem;
        font-family: system-ui, sans-serif;
      }
      [slot='trigger'],
      [data-dialog-close],
      [slot='footer'] button {
        font: inherit;
        font-size: 0.875rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #e5e5e5;
        border-radius: 0.375rem;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import './index.js';
    </script>

    <ui-dialog light-dismiss>
      <button slot="trigger" id="trigger">Open dialog</button>
      <dialog id="panel">
        <header slot="header">
          <h2 slot="title">Delete project</h2>
          <button slot="close" id="close-x" aria-label="Close dialog">✕</button>
        </header>
        <div slot="body">
          <p slot="description" id="body">
            This permanently deletes the project and everything in it. This
            action cannot be undone.
          </p>
        </div>
        <footer slot="footer">
          <button data-dialog-close id="cancel">Cancel</button>
          <button id="confirm" autofocus>Delete</button>
        </footer>
      </dialog>
    </ui-dialog>

    <button id="after">A control after the dialog</button>
  </body>
</html>
